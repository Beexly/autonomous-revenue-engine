<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pronouns — I / we / you mix</title>
  <meta name="description" content="I / we / you mix for a paste. Does not run Delta. Does not publish.">
  <style>
    :root { --ink:#1a1208; --paper:#f4ecd8; --rule:#c45c26; --mute:#6e5f4a; --ok:#2d5a27; --bad:#8b1e1e; --band:#d8ccb4; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Georgia, "Iowan Old Style", serif; }
    main { max-width:36rem; margin:2.4rem auto; padding:0 1rem; }
    .kicker { font:700 11px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rule); }
    h1 { font-size:1.4rem; margin:.3rem 0 .4rem; letter-spacing:-.02em; }
    .lede { color:var(--mute); margin:0 0 1.1rem; }
    label { display:block; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.35rem; }
    textarea { width:100%; box-sizing:border-box; min-height:8.5rem; padding:.7rem .75rem; border:1px solid var(--ink); background:#fffdf6; font:inherit; resize:vertical; }
    button { margin-top:.75rem; background:var(--ink); color:var(--paper); border:0; padding:.65rem 1.05rem; font:700 13px/1 system-ui,sans-serif; cursor:pointer; }
    #out { margin-top:1.4rem; border-top:3px solid var(--ink); padding-top:1rem; }
    .verdict { font-size:1.35rem; font-weight:700; }
    .ok { color:var(--ok); } .warn { color:var(--rule); } .bad { color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:.92rem; margin:.55rem 0; }
    td { padding:.22rem 0; border-bottom:1px dotted #d8ccb4; }
    td.k { color:var(--mute); width:4.5rem; } td.v { text-align:right; font-family:ui-monospace,monospace; width:4.2rem; }
    .mix { display:flex; height:14px; background:var(--band); margin:.8rem 0 1rem; overflow:hidden; }
    .mix span { display:block; height:100%; }
    .mix .i { background:var(--ink); } .mix .we { background:var(--rule); } .mix .you { background:var(--ok); }
    .note { font-size:.85rem; color:var(--mute); }
  </style>
</head>
<body>
<main>
  <p class="kicker">Signal Origin · person mix</p>
  <h1>pronouns</h1>
  <p class="lede">Paste a draft. This is only I / we / you. It does not count the/and (that is function-words), does not run Delta, and does not publish.</p>
  <form id="f">
    <label for="draft">Draft</label>
    <textarea id="draft" placeholder="I cut the queue. We still owe the floor. You already know the number."></textarea>
    <button type="submit">Mix</button>
  </form>
  <section id="out" hidden></section>
</main>
<script>
(function () {
  function tokens(raw) {
    var t = String(raw || "").toLowerCase().replace(/[^a-z0-9'\s]/g, " ");
    return t.trim() ? t.trim().split(/\s+/).filter(Boolean) : [];
  }
  function isI(w) { return w === "i" || w === "i'm" || w === "i’m" || w === "me" || w === "my" || w === "mine"; }
  function isWe(w) { return w === "we" || w === "we're" || w === "we’re" || w === "us" || w === "our" || w === "ours"; }
  function isYou(w) { return w === "you" || w === "you're" || w === "you’re" || w === "your" || w === "yours"; }
  function measure(raw) {
    var toks = tokens(raw);
    if (!toks.length) return { status: "EMPTY" };
    var i = 0, we = 0, you = 0;
    for (var k = 0; k < toks.length; k++) {
      var w = toks[k];
      if (isI(w)) i++;
      else if (isWe(w)) we++;
      else if (isYou(w)) you++;
    }
    var tot = i + we + you;
    var status = "NO PERSON";
    if (tot === 0) status = "NO PERSON";
    else if (i && !we && !you) status = "I-ONLY";
    else if (you && !i && !we) status = "YOU-ONLY";
    else if (we && !i && !you) status = "WE-ONLY";
    else status = "MIXED PERSON";
    return { status: status, n: toks.length, i: i, we: we, you: you, tot: tot };
  }
  var form = document.getElementById("f");
  var input = document.getElementById("draft");
  var out = document.getElementById("out");
  function pct(n, tot) { return tot ? (n / tot) * 100 : 0; }
  function render() {
    var data = measure(input.value);
    if (data.status === "EMPTY") {
      out.hidden = false;
      out.innerHTML = "<p class='warn'>empty_text</p>";
      return;
    }
    var cls = data.status === "MIXED PERSON" ? "ok" : data.status === "NO PERSON" ? "bad" : "warn";
    var t = data.tot || 1;
    var bar = data.tot
      ? "<div class='mix'><span class='i' style='width:" + pct(data.i, t).toFixed(1) + "%'></span><span class='we' style='width:" + pct(data.we, t).toFixed(1) + "%'></span><span class='you' style='width:" + pct(data.you, t).toFixed(1) + "%'></span></div>"
      : "<div class='mix'></div>";
    out.innerHTML =
      "<p class='verdict " + cls + "'>" + data.status + "</p>" + bar +
      "<table><tbody>" +
      "<tr><td class='k'>tokens</td><td></td><td class='v'>" + data.n + "</td></tr>" +
      "<tr><td class='k'>I / me / my</td><td></td><td class='v'>" + data.i + "</td></tr>" +
      "<tr><td class='k'>we / us / our</td><td></td><td class='v'>" + data.we + "</td></tr>" +
      "<tr><td class='k'>you / your</td><td></td><td class='v'>" + data.you + "</td></tr>" +
      "</tbody></table>" +
      "<p class='note'>Bar is share of person pronouns only (ink = I, clay = we, green = you). NO PERSON is a lecture. MIXED PERSON is a speaker under pressure. Not function-words. Not voice-delta.</p>";
    out.hidden = false;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); render(); });
  input.addEventListener("input", function () { if (!out.hidden) render(); });
})();
</script>
</body>
</html>
