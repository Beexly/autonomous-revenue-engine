<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bayou Breeze Air</title>
  <style>
    :root { --bg:#111; --fg:#f4f1ea; --muted:#9a9588; --line:#2c2b26; --btn:#f4f1ea; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
    main { min-height: 100dvh; max-width: 28rem; margin: 0 auto; padding: 2.5rem 1.25rem calc(6rem + env(safe-area-inset-bottom)); }
    .wm { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    h1 { font-family: ui-serif, Georgia, serif; font-size: 2rem; font-weight: 600; letter-spacing: -.03em; margin: .6rem 0 0; }
    .where { color: var(--muted); margin: .5rem 0 1.75rem; }
    ul { list-style: none; padding: 0; margin: 0 0 1.75rem; border-top: 1px solid var(--line); }
    li { padding: .9rem 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 1rem; }
    li span { color: var(--muted); }
    .note { color: var(--muted); font-size: .92rem; }
    .stick { position: fixed; left: 0; right: 0; bottom: 0; padding: .75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: .5rem; }
    .stick a { flex: 1; text-align: center; text-decoration: none; font-weight: 650; padding: .9rem .5rem; min-height: 44px; }
    .call { background: var(--btn); color: #111; }
    .txt { border: 1px solid var(--fg); color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <p class="wm">Walk-in SKU · sample · not the cinematic preview</p>
    <h1>Bayou Breeze Air</h1>
    <p class="where">Houston · after-hours calls</p>
    <ul>
      <li>Service call <span>from $89</span></li>
      <li>Capacitor / recharge <span>from $220</span></li>
      <li>Install quote <span>quote</span></li>
    </ul>
    <p class="note">No reviews. No 555. Live page gets their number.</p>
  </main>
  <div class="stick">
    <a class="call" href="#sample-call">Call</a>
    <a class="txt" href="#sample-text">Text a photo</a>
  </div>
</body>
</html>
