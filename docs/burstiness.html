<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>burstiness — sentence-length CV</title>
  <meta name="description" content="Coefficient of variation of sentence lengths as a sparkline. Does not rewrite. Does not publish.">
  <style>
    :root { --ink:#1a1208; --paper:#f4ecd8; --rule:#c45c26; --mute:#6e5f4a; --ok:#2d5a27; --bad:#8b1e1e; --band:#d8ccb4; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Georgia, "Iowan Old Style", serif; }
    main { max-width:36rem; margin:2.4rem auto; padding:0 1rem; }
    .kicker { font:700 11px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rule); }
    h1 { font-size:1.4rem; margin:.3rem 0 .4rem; letter-spacing:-.02em; }
    .lede { color:var(--mute); margin:0 0 1.1rem; }
    label { display:block; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.35rem; }
    textarea { width:100%; box-sizing:border-box; min-height:8.5rem; padding:.7rem .75rem; border:1px solid var(--ink); background:#fffdf6; font:inherit; resize:vertical; }
    button { margin-top:.75rem; background:var(--ink); color:var(--paper); border:0; padding:.65rem 1.05rem; font:700 13px/1 system-ui,sans-serif; cursor:pointer; }
    #out { margin-top:1.4rem; border-top:3px solid var(--ink); padding-top:1rem; }
    .verdict { font-size:1.35rem; font-weight:700; }
    .human { color:var(--ok); } .flat { color:var(--bad); } .erratic { color:var(--rule); }
    table { width:100%; border-collapse:collapse; font-size:.92rem; margin:.55rem 0; }
    td { padding:.22rem 0; border-bottom:1px dotted #d8ccb4; }
    td.k { color:var(--mute); } td.v { text-align:right; font-family:ui-monospace,monospace; }
    .spark { display:flex; align-items:flex-end; gap:3px; height:64px; margin:.8rem 0 1rem; border-bottom:1px solid var(--ink); padding-bottom:2px; }
    .spark b { display:block; flex:1; min-width:4px; background:var(--ink); }
    .spark b.short { background:var(--rule); }
    .note { font-size:.85rem; color:var(--mute); }
  </style>
</head>
<body>
<main>
  <p class="kicker">Signal Origin · cadence</p>
  <h1>burstiness</h1>
  <p class="lede">Paste a draft. This measures sentence-length coefficient of variation and draws a sparkline. Flat cadence is a model tell. It does not score Hold, rewrite, or publish.</p>
  <form id="f">
    <label for="draft">Draft</label>
    <textarea id="draft" placeholder="One short. Then a longer sentence that actually carries the claim. Then cut."></textarea>
    <button type="submit">Measure</button>
  </form>
  <section id="out" hidden></section>
</main>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function sentences(raw) {
    var t = String(raw || "").replace(/\r\n/g, "\n").trim();
    if (!t) return [];
    var parts = t.split(/(?<=[.!?])(?:\s+|\n+|$)/).map(function (s) { return s.trim(); }).filter(Boolean);
    if (!parts.length) parts = [t];
    return parts;
  }
  function words(s) {
    var t = String(s || "").trim();
    return t ? t.split(/\s+/).length : 0;
  }
  function mean(xs) {
    if (!xs.length) return 0;
    var s = 0;
    for (var i = 0; i < xs.length; i++) s += xs[i];
    return s / xs.length;
  }
  function stdev(xs) {
    if (xs.length < 2) return 0;
    var m = mean(xs);
    var acc = 0;
    for (var i = 0; i < xs.length; i++) acc += (xs[i] - m) * (xs[i] - m);
    return Math.sqrt(acc / (xs.length - 1));
  }
  function measure(raw) {
    var sents = sentences(raw);
    var lens = sents.map(words);
    var m = mean(lens);
    var sd = stdev(lens);
    var cv = m > 0 ? sd / m : 0;
    var status = "EMPTY";
    if (!sents.length) status = "EMPTY";
    else if (sents.length < 3) status = "TOO-SHORT";
    else if (cv < 0.28) status = "FLAT";
    else if (cv > 0.85) status = "ERRATIC";
    else status = "HUMAN-RANGE";
    return { sents: sents, lens: lens, mean: m, sd: sd, cv: cv, status: status };
  }

  var form = document.getElementById("f");
  var input = document.getElementById("draft");
  var out = document.getElementById("out");

  function render() {
    var data = measure(input.value);
    if (data.status === "EMPTY") {
      out.hidden = false;
      out.innerHTML = "<p class='flat'>empty_text</p>";
      return;
    }
    var cls = data.status === "HUMAN-RANGE" ? "human" : data.status === "FLAT" ? "flat" : "erratic";
    var max = 1;
    for (var i = 0; i < data.lens.length; i++) if (data.lens[i] > max) max = data.lens[i];
    var bars = data.lens.map(function (n) {
      var h = Math.max(4, Math.round((n / max) * 60));
      var c = n <= 2 ? " short" : "";
      return "<b class='" + c.trim() + "' style='height:" + h + "px' title='" + n + " words'></b>";
    }).join("");
    var rows =
      "<tr><td class='k'>sentences</td><td class='v'>" + data.sents.length + "</td></tr>" +
      "<tr><td class='k'>mean words / sentence</td><td class='v'>" + data.mean.toFixed(1) + "</td></tr>" +
      "<tr><td class='k'>stdev</td><td class='v'>" + data.sd.toFixed(2) + "</td></tr>" +
      "<tr><td class='k'>CV</td><td class='v'>" + data.cv.toFixed(2) + "</td></tr>";
    out.innerHTML =
      "<p class='verdict " + cls + "'>" + data.status + "</p>" +
      "<div class='spark'>" + bars + "</div>" +
      "<table><tbody>" + rows + "</tbody></table>" +
      "<p class='note'>FLAT is CV &lt; 0.28 on 3+ sentences. HUMAN-RANGE is 0.28–0.85. ERRATIC is above that. Staccato one- and two-word bars are clay. This is a cadence ruler, not qi-check.</p>";
    out.hidden = false;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    render();
  });
  input.addEventListener("input", function () {
    if (!out.hidden) render();
  });
})();
</script>
</body>
</html>
