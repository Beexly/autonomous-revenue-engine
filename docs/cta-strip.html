<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cta-strip — residue after CTAs</title>
  <meta name="description" content="Shows a draft with CTAs, hashtags, and thread bait removed. Does not rewrite. Does not publish.">
  <style>
    :root { --ink:#1a1208; --paper:#f4ecd8; --rule:#c45c26; --mute:#6e5f4a; --ok:#2d5a27; --bad:#8b1e1e; --band:#d8ccb4; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Georgia, "Iowan Old Style", serif; }
    main { max-width:36rem; margin:2.4rem auto; padding:0 1rem; }
    .kicker { font:700 11px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rule); }
    h1 { font-size:1.4rem; margin:.3rem 0 .4rem; letter-spacing:-.02em; }
    .lede { color:var(--mute); margin:0 0 1.1rem; }
    label { display:block; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:.35rem; }
    textarea { width:100%; box-sizing:border-box; min-height:8.5rem; padding:.7rem .75rem; border:1px solid var(--ink); background:#fffdf6; font:inherit; resize:vertical; }
    button { margin-top:.75rem; background:var(--ink); color:var(--paper); border:0; padding:.65rem 1.05rem; font:700 13px/1 system-ui,sans-serif; cursor:pointer; }
    #out { margin-top:1.4rem; border-top:3px solid var(--ink); padding-top:1rem; }
    .verdict { font-size:1.35rem; font-weight:700; }
    .holds { color:var(--ok); } .heavy { color:var(--rule); } .hollow { color:var(--bad); }
    table { width:100%; border-collapse:collapse; font-size:.92rem; margin:.55rem 0; }
    td { padding:.22rem 0; border-bottom:1px dotted #d8ccb4; }
    td.k { color:var(--mute); } td.v { text-align:right; font-family:ui-monospace,monospace; }
    .pair { display:grid; grid-template-columns:1fr; gap:.6rem; }
    .box { font:14px/1.45 ui-monospace,monospace; background:#fffdf6; border:1px solid var(--ink); padding:.7rem .75rem; white-space:pre-wrap; word-break:break-word; min-height:3rem; }
    .box.gone { background:#f3d4c8; }
    .cap { font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); margin:0 0 .3rem; }
    .note { font-size:.85rem; color:var(--mute); }
  </style>
</head>
<body>
<main>
  <p class="kicker">Signal Origin · residue</p>
  <h1>cta-strip</h1>
  <p class="lede">Paste a draft. This removes hashtags, thread bait, follow/like/RT lines, and  🧵🔥👇. What remains is the residue. It does not rewrite or publish.</p>
  <form id="f">
    <label for="draft">Draft</label>
    <textarea id="draft" placeholder="Shipped the 9.2 floor.\n\nFollow for the rest of the thread 🧵\n#buildinpublic #ai"></textarea>
    <button type="submit">Strip</button>
  </form>
  <section id="out" hidden></section>
</main>
<script>
(function () {
  var PHRASES = [
    /\bfollow\s+(me|for|along)\b[^.\n]*/gi,
    /\blike\s+(and|&)\s*(rt|retweet|share)\b[^.\n]*/gi,
    /\b(rt|retweet)\s+(this|if)\b[^.\n]*/gi,
    /\blink\s+in\s+bio\b[^.\n]*/gi,
    /\b(comment|drop)\s+(below|a|your)\b[^.\n]*/gi,
    /\bsubscribe\b[^.\n]*/gi,
    /\bsign\s+up\b[^.\n]*/gi,
    /\bdm\s+me\b[^.\n]*/gi,
    /\b(thread|more)\s+below\b[^.\n]*/gi,
    /\bread\s+more\b[^.\n]*/gi,
    /\bclick\s+(the|here|this)\b[^.\n]*/gi,
    /\bwhat\s+did\s+i\s+miss\b[^.\n]*/gi,
    /\bagree\??\s*$/gim
  ];
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function words(s) {
    var t = String(s || "").trim();
    return t ? t.split(/\s+/).filter(Boolean).length : 0;
  }
  function strip(raw) {
    var t = String(raw || "").replace(/\r\n/g, "\n");
    var tags = (t.match(/#[\p{L}\p{N}_]+/gu) || []).length;
    var bait = (t.match(/[🧵🔥👇➡️🔗]/g) || []).length;
    var out = t;
    out = out.replace(/#[\p{L}\p{N}_]+/gu, " ");
    out = out.replace(/[🧵🔥👇➡️🔗]/g, " ");
    for (var i = 0; i < PHRASES.length; i++) out = out.replace(PHRASES[i], " ");
    out = out.replace(/^[ \t]*\d+\/[\d\s]*$/gm, " ");
    out = out.replace(/[ \t]+/g, " ");
    out = out.replace(/\n{3,}/g, "\n\n").trim();
    return { residue: out, tags: tags, bait: bait };
  }
  function measure(raw) {
    var t = String(raw || "");
    if (!t.trim()) return { status: "EMPTY" };
    var s = strip(t);
    var before = words(t);
    var after = words(s.residue);
    var removed = Math.max(0, before - after);
    var status = "HOLDS";
    if (after === 0 || after < 8) status = "HOLLOW";
    else if (removed >= 4 || s.tags >= 2 || s.bait >= 2) status = "CTA-HEAVY";
    return {
      status: status,
      before: before,
      after: after,
      removed: removed,
      tags: s.tags,
      bait: s.bait,
      residue: s.residue,
      original: t
    };
  }
  var form = document.getElementById("f");
  var input = document.getElementById("draft");
  var out = document.getElementById("out");
  function render() {
    var data = measure(input.value);
    if (data.status === "EMPTY") {
      out.hidden = false;
      out.innerHTML = "<p class='heavy'>empty_text</p>";
      return;
    }
    var cls = data.status === "HOLDS" ? "holds" : data.status === "CTA-HEAVY" ? "heavy" : "hollow";
    var rows =
      "<tr><td class='k'>words before</td><td class='v'>" + data.before + "</td></tr>" +
      "<tr><td class='k'>words after</td><td class='v'>" + data.after + "</td></tr>" +
      "<tr><td class='k'>stripped</td><td class='v'>" + data.removed + "</td></tr>" +
      "<tr><td class='k'>hashtags</td><td class='v'>" + data.tags + "</td></tr>" +
      "<tr><td class='k'>thread bait</td><td class='v'>" + data.bait + "</td></tr>";
    out.innerHTML =
      "<p class='verdict " + cls + "'>" + data.status + "</p>" +
      "<table><tbody>" + rows + "</tbody></table>" +
      "<div class='pair'><div><p class='cap'>residue</p><div class='box'>" + esc(data.residue || "(nothing left)") + "</div></div></div>" +
      "<p class='note'>HOLDS = a post remains after CTAs and tags die. CTA-HEAVY = 4+ words, 2+ hashtags, or 2+ bait glyphs came off. HOLLOW = residue under 8 words. Does not post.</p>";
    out.hidden = false;
  }
  form.addEventListener("submit", function (e) { e.preventDefault(); render(); });
  input.addEventListener("input", function () { if (!out.hidden) render(); });
})();
</script>
</body>
</html>
