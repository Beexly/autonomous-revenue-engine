<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>emq-cover — local Event Match Quality coverage</title>
  <meta name="description" content="Score which CAPI user_data parameters you actually send. Local coverage only. Not Meta EMQ. Does not send. Does not spend.">
  <style>
    :root { --ink:#1a1208; --paper:#f4ecd8; --rule:#c45c26; --mute:#6e5f4a; --ok:#2d5a27; --bad:#8a2a12; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 Georgia, "Iowan Old Style", serif; }
    main { max-width:36rem; margin:2.4rem auto; padding:0 1rem 3rem; }
    .kicker { font:700 11px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--rule); }
    h1 { font-size:1.4rem; margin:.3rem 0 .4rem; }
    .lede { color:var(--mute); margin:0 0 1.1rem; }
    label { display:block; font:700 11px/1 ui-monospace,monospace; letter-spacing:.08em; text-transform:uppercase; margin:.7rem 0 .35rem; }
    textarea, input { width:100%; box-sizing:border-box; padding:.55rem .7rem; border:1px solid var(--ink); background:#fffdf6; font:13px/1.4 ui-monospace,monospace; }
    button { margin:.7rem .5rem 0 0; background:var(--ink); color:var(--paper); border:0; padding:.65rem 1.05rem; font:700 13px/1 system-ui,sans-serif; cursor:pointer; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:.35rem .8rem; margin:.4rem 0 1rem; }
    .grid label.row { display:flex; gap:.45rem; align-items:center; font:14px/1.3 Georgia,serif; letter-spacing:0; text-transform:none; margin:0; }
    .grid input { width:auto; }
    pre { white-space:pre-wrap; word-break:break-word; background:#fffdf6; border:1px solid var(--ink); padding:.7rem; font:12px/1.4 ui-monospace,monospace; }
    .ok { color:var(--ok); font-weight:700; }
    .bad { color:var(--bad); font-weight:700; }
    .note { font-size:.85rem; color:var(--mute); }
    table { width:100%; border-collapse:collapse; font:13px/1.35 ui-monospace,monospace; }
    td { padding:.28rem 0; border-bottom:1px solid #e0d6c0; }
    td.v { text-align:right; }
    .band { font-size:1.25rem; font-weight:700; margin:.4rem 0; }
  </style>
</head>
<body>
<main>
  <p class="kicker">Signal Origin · measurement</p>
  <h1>emq-cover</h1>
  <p class="lede">Tick the CAPI <code>user_data</code> fields you send, or paste a payload. This page estimates coverage locally. It is not Events Manager EMQ. It does not send, hash off-device, store, or spend.</p>

  <form id="f">
    <label>High-weight match keys</label>
    <div class="grid" id="hi"></div>
    <label>Address / identity</label>
    <div class="grid" id="mid"></div>
    <label>Paste CAPI user_data JSON (optional)</label>
    <textarea id="json" rows="6" placeholder='{"em":["…"],"ph":["…"],"fbp":"fb.1.…","client_ip_address":"1.2.3.4"}'></textarea>
    <label>Email to normalize + hash locally (optional, never leaves this tab)</label>
    <input id="email" type="email" autocomplete="off" placeholder="optional">
    <label>Phone to normalize + hash locally</label>
    <input id="phone" type="tel" autocomplete="off" placeholder="optional">
    <button type="submit">Score coverage</button>
    <button type="button" id="ex">Load example</button>
  </form>
  <section id="out" hidden></section>
</main>
<script>
(function () {
  var HI = [
    ["em", "em (email)"],
    ["ph", "ph (phone)"],
    ["fbp", "fbp"],
    ["fbc", "fbc"],
    ["client_ip_address", "client IP"],
    ["client_user_agent", "user agent"],
    ["external_id", "external_id"]
  ];
  var MID = [
    ["fn", "fn (first)"],
    ["ln", "ln (last)"],
    ["ct", "ct (city)"],
    ["st", "st (state)"],
    ["zp", "zp (zip)"],
    ["country", "country"],
    ["db", "db (DOB)"],
    ["ge", "ge (gender)"]
  ];
  function boxes(el, items) {
    el.innerHTML = items.map(function (p) {
      return "<label class='row'><input type='checkbox' data-k='" + p[0] + "'> " + p[1] + "</label>";
    }).join("");
  }
  boxes(document.getElementById("hi"), HI);
  boxes(document.getElementById("mid"), MID);

  function present(obj) {
    if (obj == null) return false;
    if (Array.isArray(obj)) return obj.some(function (x) { return present(x); });
    if (typeof obj === "string") return obj.trim().length > 0;
    if (typeof obj === "number") return true;
    if (typeof obj === "object") return Object.keys(obj).length > 0;
    return Boolean(obj);
  }
  function sha256(s) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (buf) {
      return Array.from(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    });
  }
  function esc(s) {
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  function collect() {
    var set = {};
    document.querySelectorAll("input[data-k]").forEach(function (c) {
      if (c.checked) set[c.getAttribute("data-k")] = true;
    });
    var raw = document.getElementById("json").value.trim();
    if (raw) {
      var parsed = JSON.parse(raw);
      var ud = parsed.user_data || parsed.userData || parsed;
      Object.keys(ud).forEach(function (k) { if (present(ud[k])) set[k] = true; });
    }
    return set;
  }
  function band(hi, mid) {
    if (hi >= 5 && mid >= 3) return ["likely 8\u201310 band", "ok"];
    if (hi >= 4) return ["likely 6\u20138 band", "ok"];
    if (hi >= 2) return ["likely 4\u20136 band", ""];
    if (hi >= 1) return ["likely 2\u20134 band", "bad"];
    return ["likely 1\u20132 band", "bad"];
  }
  document.getElementById("ex").addEventListener("click", function () {
    document.getElementById("json").value = JSON.stringify({
      event_name: "Purchase",
      action_source: "website",
      user_data: {
        em: ["hashed"],
        ph: ["hashed"],
        fbp: "fb.1.1710000000.123",
        client_ip_address: "203.0.113.9",
        client_user_agent: "Mozilla/5.0",
        external_id: ["hashed"],
        fn: ["hashed"],
        ln: ["hashed"],
        ct: ["hashed"],
        st: ["tx"],
        zp: ["77002"],
        country: ["us"]
      }
    }, null, 2);
    document.getElementById("email").value = "Alex.Roe@Example.COM ";
    document.getElementById("phone").value = "+1 (713) 555-0199";
  });
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var set;
    try { set = collect(); }
    catch (err) {
      document.getElementById("out").hidden = false;
      document.getElementById("out").innerHTML = "<p class='bad'>JSON parse failed: " + esc(err.message) + "</p>";
      return;
    }
    var hiN = HI.filter(function (p) { return set[p[0]]; }).length;
    var midN = MID.filter(function (p) { return set[p[0]]; }).length;
    var b = band(hiN, midN);
    var missingHi = HI.filter(function (p) { return !set[p[0]]; }).map(function (p) { return p[0]; });
    var missingMid = MID.filter(function (p) { return !set[p[0]]; }).map(function (p) { return p[0]; });
    var rows = HI.concat(MID).map(function (p) {
      var on = set[p[0]];
      return "<tr><td>" + p[0] + "</td><td class='v " + (on ? "ok" : "bad") + "'>" + (on ? "present" : "missing") + "</td></tr>";
    }).join("");
    var email = (document.getElementById("email").value || "").trim().toLowerCase();
    var phone = (document.getElementById("phone").value || "").replace(/\D/g, "");
    var jobs = [];
    if (email) jobs.push(sha256(email).then(function (h) { return ["em", email, h]; }));
    if (phone) jobs.push(sha256(phone).then(function (h) { return ["ph", phone, h]; }));
    Promise.all(jobs).then(function (pairs) {
      var hashBlock = pairs.length
        ? "<label>Local SHA-256 after Meta-style normalize</label><pre>" + esc(pairs.map(function (p) {
            return p[0] + "  in: " + p[1] + "\n" + p[0] + "  sha256: " + p[2];
          }).join("\n\n")) + "</pre>"
        : "";
      var miss = "";
      if (missingHi.length) miss += "<p>High-weight missing: <code>" + esc(missingHi.join(", ")) + "</code></p>";
      if (missingMid.length) miss += "<p class='note'>Address missing: <code>" + esc(missingMid.join(", ")) + "</code></p>";
      document.getElementById("out").hidden = false;
      document.getElementById("out").innerHTML =
        "<p class='ok'>DRY RUN \u2014 nothing sent</p>" +
        "<p class='band " + b[1] + "'>" + hiN + "/7 high-weight \u00b7 " + midN + "/8 address \u00b7 " + b[0] + "</p>" +
        "<p class='note'>Do not claim EMQ until Events Manager shows the 1\u201310 number. This is a presence count.</p>" +
        miss +
        "<table><tbody>" + rows + "</tbody></table>" +
        hashBlock +
        "<p class='note'>Normalize before hashing: email lowercase+trim; phone digits only with country code. Hashing mixed-case email silently kills match rate.</p>";
    });
  });
})();
</script>
</body>
</html>
