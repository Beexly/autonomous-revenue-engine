<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qi-check — Viewport Hold</title>
  <meta name="description" content="Score a draft for first-screen density and qualified-impression fitness. Does not write the post.">
  <style>
    html, body { margin: 0; background: #0e0e0e; color: #e8e4d9; font-family: ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; letter-spacing: -0.03em; margin-bottom: 6px; }
    p.lede { color: #b7b2a6; margin-top: 0; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: #161616;
      color: #e8e4d9;
      border: 1px solid #3a3a36;
      padding: 12px;
      font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      background: #e8e4d9;
      color: #111;
      border: 0;
      font-weight: 650;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .err { color: #d46a6a; }
    section { margin-top: 28px; }
    .rec { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td { padding: 4px 0; }
    td.k { color: #b7b2a6; }
    td.v { text-align: right; }
    ol { padding-left: 18px; }
    li { margin: 6px 0; }
    .muted { color: #b7b2a6; }
  </style>
</head>
<body>
  <main>
    <h1>qi-check</h1>
    <p class="lede">
      Paste your draft. This scores first-screen density, bait, and Hold fitness.
      It does not write the post. It does not publish.
      Scoring runs in this page — no server required.
    </p>
    <form id="form">
      <textarea id="draft" rows="10" placeholder="First line is the decision."></textarea>
      <button type="submit" id="go">Score</button>
    </form>
    <p id="error" class="err" hidden></p>
    <section id="result" hidden></section>
  </main>
  <script>
/**
 * Inlined from apps/qi-check/lib/score.js (version 0.2.0).
 * Pure JS — no Node APIs. Keep in sync with lib/score.js.
 */
const HOLD_FLOOR = 9.2;
const SOFT_FLOOR = 7.0;

const BAIT_PATTERNS = [
  /\bhot take\b/i,
  /\bwill be banned\b/i,
  /\blike if you agree\b/i,
  /\bcomment (yes|below|if)\b/i,
  /\b(share|retweet) this\b/i,
  /\bthread\s*\u{1F9F5}/iu,
  /\b\d+\s+(ways|tips|habits|mistakes)\b/i,
  /\bnot financial advice\b/i,
  /\bgrowth hack\b/i,
];

function sentences(text) {
  return text
    .split(/(?<=[.!?])\s+/)
    .map((s) => s.trim())
    .filter(Boolean);
}

function firstScreen(text, limit = 160) {
  const t = text.replace(/\s+/g, " ").trim();
  return t.slice(0, limit);
}

const DECISION_WORDS = /\b(killed|refused|paid|shipped|deferred|cut|built|failed|measured)\b/i;
const NUMBER_WORDS =
  /\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|dozen|hundred|thousand)\b/i;

function scoreFirstScreenDensity(text) {
  const head = firstScreen(text);
  const hasClaim =
    /\b(killed|paid|refused|built|measured|failed|shipped|cut|deferred)\b/i.test(head) ||
    /\d/.test(head) ||
    head.length > 40;
  const buried = /^(so|well|today|in this|let me|i('ve| have) been)\b/i.test(head.trim());
  let s = hasClaim ? 7 : 4;
  if (buried) s -= 2;
  if (head.includes("?") && head.length < 80) s -= 1;
  const firstClause = head.split(/[.!?]/)[0] || "";
  const decisionInOpen = DECISION_WORDS.test(firstClause);
  if (decisionInOpen) s += 2;
  if (decisionInOpen && NUMBER_WORDS.test(firstClause)) s += 1;
  return clamp(s);
}

function scoreFoldStructure(text) {
  const lines = text.split(/\n+/).map((l) => l.trim()).filter(Boolean);
  if (lines.length === 0) return 0;
  const shortOpen = lines[0].length <= 90;
  const hasBody = lines.length >= 2 || text.length > 120;
  let s = shortOpen ? 7 : 4;
  if (hasBody) s += 1;
  if (lines[0] === lines[0].toUpperCase() && lines[0].length > 20) s -= 2;
  if (lines.length >= 3) s += 0.5;
  const last = lines[lines.length - 1];
  const hasLanding =
    lines.length >= 3 && last !== lines[0] && last.length <= 90 && !last.endsWith("?");
  if (hasLanding) s += 1.5;
  return clamp(s);
}

function scoreBait(text) {
  let hits = 0;
  for (const re of BAIT_PATTERNS) if (re.test(text)) hits++;
  return clamp(10 - hits * 2);
}

function scoreLengthFitness(text) {
  const n = text.trim().length;
  if (n < 40) return 3;
  if (n <= 400) return 9;
  if (n <= 900) return 7;
  if (n <= 2000) return 5;
  return 3;
}

function hasStaccatoOveruse(text) {
  const ss = sentences(text);
  if (ss.length < 3) return false;
  const shortCount = ss.filter((s) => s.split(/\s+/).length <= 2).length;
  return shortCount / ss.length > 0.4;
}

function scoreBurstiness(text) {
  const ss = sentences(text);
  if (ss.length < 2) return 6;
  const lens = ss.map((s) => s.split(/\s+/).length);
  const mean = lens.reduce((a, b) => a + b, 0) / lens.length;
  const variance =
    lens.reduce((a, b) => a + (b - mean) ** 2, 0) / lens.length;
  const cv = mean === 0 ? 0 : Math.sqrt(variance) / mean;
  let s;
  if (cv < 0.2) s = 4;
  else if (cv < 0.35) s = 6;
  else if (cv < 0.55) s = 8;
  else s = 9;
  if (hasStaccatoOveruse(text)) s = Math.min(s, 5);
  return clamp(s);
}

function ocrFlags(text) {
  const head = firstScreen(text, 200);
  return {
    originalAnglePresent:
      /\b(we|i)\b/i.test(text) &&
      /\b(killed|paid|refused|built|failed|shipped)\b/i.test(text),
    replyPrimaryOnly: false,
    substancePastFirstScreen: text.trim().length > head.trim().length + 20,
  };
}

function clamp(n) {
  return Math.max(0, Math.min(10, Math.round(n * 10) / 10));
}

function scoreDraft(text, { platform = "x" } = {}) {
  if (!text || !String(text).trim()) {
    return {
      error: "empty_text",
      recommendation: "Hard rewrite",
    };
  }
  const t = String(text);
  const scores = {
    firstScreenDensity: scoreFirstScreenDensity(t),
    foldStructure: scoreFoldStructure(t),
    baitAvoidance: scoreBait(t),
    lengthFitness: scoreLengthFitness(t),
    burstiness: scoreBurstiness(t),
  };
  const weights = {
    firstScreenDensity: 0.3,
    foldStructure: 0.2,
    baitAvoidance: 0.25,
    lengthFitness: 0.15,
    burstiness: 0.1,
  };
  let total = 0;
  for (const k of Object.keys(weights)) total += scores[k] * weights[k];
  total = Math.round(total * 10) / 10;

  const flags = ocrFlags(t);
  const fixes = [];
  if (scores.firstScreenDensity < 8)
    fixes.push("Put the concrete decision in the first line \u2014 not the third.");
  if (scores.foldStructure < 7)
    fixes.push("Open short; mechanism in line 2\u20133; no buried lede.");
  if (scores.baitAvoidance < 9)
    fixes.push("Strip engagement-farm CTAs and listicle bait phrasing.");
  if (scores.lengthFitness < 7)
    fixes.push("Tighten length; one complete thought over sprawl.");
  if (scores.burstiness < 7)
    fixes.push("Vary sentence length; avoid flat model cadence.");
  if (!flags.originalAnglePresent)
    fixes.push("Add a specific decision, cost, or failure \u2014 not a category lecture.");
  const staccatoHeavy = hasStaccatoOveruse(t);
  if (staccatoHeavy)
    fixes.push("Cut the one/two-word staccato fragments \u2014 full sentences only.");
  if (total < HOLD_FLOOR)
    fixes.push("Composite " + total + " is below Hold floor " + HOLD_FLOOR + ". Rewrite or kill.");

  let recommendation = "Hold";
  if (total < SOFT_FLOOR || scores.baitAvoidance < 6) recommendation = "Hard rewrite";
  else if (
    total < HOLD_FLOOR ||
    scores.firstScreenDensity < 8 ||
    scores.baitAvoidance < 9 ||
    staccatoHeavy ||
    fixes.length >= 3
  )
    recommendation = "Soft rewrite";

  return {
    platform,
    scores,
    total,
    floors: { hold: HOLD_FLOOR, soft: SOFT_FLOOR },
    flags,
    fixes,
    recommendation,
    firstScreenPreview: firstScreen(t),
    version: "0.3.0",
  };
}

(function () {
  const form = document.getElementById("form");
  const draft = document.getElementById("draft");
  const go = document.getElementById("go");
  const err = document.getElementById("error");
  const out = document.getElementById("result");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    err.hidden = true;
    out.hidden = true;
    go.disabled = true;
    go.textContent = "Scoring\u2026";
    try {
      const data = scoreDraft(draft.value, { platform: "x" });
      if (data.error) {
        err.textContent = data.error;
        err.hidden = false;
      } else {
        render(data);
      }
    } catch (ex) {
      err.textContent = String(ex.message || ex);
      err.hidden = false;
    } finally {
      go.disabled = false;
      go.textContent = "Score";
    }
  });

  function render(data) {
    const scores = data.scores || {};
    const rows = Object.keys(scores).map(function (k) {
      return "<tr><td class='k'>" + k + "</td><td class='v'>" + scores[k] + "</td></tr>";
    }).join("");
    const preview = data.firstScreenPreview
      ? "<p class='muted'>First screen: " + escapeHtml(data.firstScreenPreview) + "</p>"
      : "";
    const fixes = Array.isArray(data.fixes) && data.fixes.length
      ? "<ol>" + data.fixes.map(function (f) { return "<li>" + escapeHtml(f) + "</li>"; }).join("") + "</ol>"
      : "<p>No fix list. Hold stands.</p>";
    out.innerHTML =
      "<p class='rec'>" + escapeHtml(data.recommendation) + " \u00b7 " + data.total + "</p>" +
      "<p class='muted' style='margin-top:0'>Hold floor " + (data.floors && data.floors.hold) +
      ". Soft floor " + (data.floors && data.floors.soft) + ".</p>" +
      "<table><tbody>" + rows + "</tbody></table>" +
      preview + fixes;
    out.hidden = false;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
  </script>
</body>
</html>
