# Third-party code vendored into this repository is not ours to fix, and
# analysing it as if it were produces noise that buries real findings.
#
# This was added after SonarCloud failed PR #57 with "C Security Rating on New
# Code". The cause was mechanical rather than a defect we introduced: minifying
# the vendored three.js build rewrote all 58,190 lines of it, so an upstream
# library counted in full as *new* code and its findings landed against this
# pull request. PR #55, which touched none of it, passed.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/*.min.js,**/*.min.css
