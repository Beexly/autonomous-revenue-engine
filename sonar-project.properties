# apps/qi-check/public/hold.html and docs/qi-check.html are deliberately
# byte-identical copies of apps/qi-check/lib/score.js's scoring logic,
# inlined so each page runs standalone with no build step and no server.
# ops/tools/tools.test.mjs (via apps/qi-check/lib/score.test.js) extracts
# and executes each copy's real code and asserts they agree on every
# sample draft — that test is what actually guards against drift, not
# code uniqueness. Excluded from copy-paste detection rather than
# refactored into one shared bundle, which would reintroduce the build
# step these pages exist to avoid.
sonar.cpd.exclusions=apps/qi-check/public/hold.html,docs/qi-check.html
