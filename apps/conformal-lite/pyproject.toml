[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-lite"
version = "0.1.0"
description = "Free-core adaptive conformal prediction: ACI, SAOCP, CQR, valid e-values."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[project.scripts]
conformal-lite = "conformal_lite.__main__:main"

[tool.setuptools.packages.find]
include = ["conformal_lite*"]
