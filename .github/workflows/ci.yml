name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    name: conformal-lite (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: apps/conformal-lite
        run: pip install .
      - name: Test
        working-directory: apps/conformal-lite
        run: python -m unittest discover -s tests -v
      - name: Smoke run
        run: |
          conformal-lite --mode aci --steps 50
          conformal-lite --mode saocp --steps 50
          conformal-lite --mode cqr --steps 50
          conformal-lite --mode evalue --steps 50

  node:
    name: JS micro-apps (node --test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [hn-bait, qi-check, subject-fold, swap-check, voice-delta]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        working-directory: apps/${{ matrix.app }}
        run: npm test
