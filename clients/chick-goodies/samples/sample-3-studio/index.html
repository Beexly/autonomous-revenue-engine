<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 — Charcuterie Chick</title>
<meta name="description" content="Five tables. Live quote. Book 832-458-8180.">
<link rel="canonical" href="https://charcuterie-chick-sample-3.vercel.app/">
<meta name="theme-color" content="#29382b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Outfit:wght@400&display=swap" rel="stylesheet">
<style>
/* Noma color + type, EMP contain photos, Floema 01–05, Platter calculator */
:root {
  --ink: rgb(41, 56, 43);
  --paper: rgb(249, 249, 243);
  --reckless: Fraunces, Georgia, serif;
  --roobert: Outfit, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-snap-type: y mandatory; }
body { background: var(--ink); color: var(--paper); font-family: var(--reckless); font-size: 18px; line-height: 27px; }
a { color: inherit; text-decoration: none; }
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 4;
  display: flex; justify-content: space-between;
  padding: 24px 40px;
  font-family: var(--roobert);
  font-size: 16px;
  letter-spacing: 0.18px;
}
.ch {
  min-height: 100svh;
  scroll-snap-align: start;
  position: relative;
  display: grid;
  place-items: center;
  background: var(--ink);
}
.ch img {
  width: min(1298px, 92vw);
  height: min(745.5px, 70svh);
  object-fit: contain;
}
.ch .meta {
  position: absolute;
  left: 40px;
  bottom: 40px;
}
.ch .n {
  font-size: 72px;
  font-weight: 500;
  letter-spacing: -1.44px;
  line-height: 0.9;
}
.ch h2 { font-size: 30px; font-weight: 400; margin-top: 8px; }
.ch p { font-family: var(--roobert); font-size: 16px; letter-spacing: 0.18px; opacity: 0.8; }
.calc {
  scroll-snap-align: start;
  min-height: 100svh;
  padding: 120px 40px 80px;
  display: grid;
  gap: 40px;
  background: var(--paper);
  color: var(--ink);
}
@media (min-width: 900px) { .calc { grid-template-columns: 1fr 1fr; align-items: center; } }
.calc h1 { font-size: 72px; font-weight: 500; letter-spacing: -1.44px; line-height: 0.9; }
form { display: grid; gap: 14px; }
label { display: grid; gap: 4px; font-family: var(--roobert); font-size: 16px; letter-spacing: 0.18px; }
input, select, textarea {
  font-family: var(--reckless);
  font-size: 18px;
  padding: 8px 0;
  border: 0;
  border-bottom: 0.67px solid var(--ink);
  background: transparent;
  border-radius: 0;
  color: inherit;
}
button {
  font-family: var(--reckless);
  font-size: 30px;
  padding: 19.5px 42px 19.5px 30px;
  border: 0.67px solid var(--ink);
  background: transparent;
  border-radius: 0;
  cursor: pointer;
  justify-self: start;
}
.go { display: flex; gap: 12px; flex-wrap: wrap; }
#est div { display: flex; justify-content: space-between; padding: 6px 0; }
</style>
</head>
<body>
<div class="bar"><span>Charcuterie Chick</span><a href="tel:+18324588180">Book a table</a></div>
<section class="ch">
  <img src="img/knot-hero.jpg" width="945" height="720" alt="Holy Grail of Grazing">
  <div class="meta"><div class="n">01</div><h2>Holy Grail of Grazing</h2><p>$2,000 / $3,500</p></div>
</section>
<section class="ch">
  <img src="img/knot-2.jpg" width="945" height="720" alt="Grand Graze">
  <div class="meta"><div class="n">02</div><h2>Grand Graze</h2><p>$38 a person</p></div>
</section>
<section class="ch">
  <img src="img/knot-3.jpg" width="945" height="720" alt="Super Graze">
  <div class="meta"><div class="n">03</div><h2>Super Graze</h2><p>$30 a person</p></div>
</section>
<section class="ch">
  <img src="img/knot-4.jpg" width="945" height="720" alt="Grazing Standard">
  <div class="meta"><div class="n">04</div><h2>Grazing Standard</h2><p>$26 a person</p></div>
</section>
<section class="ch">
  <img src="img/wide-640.jpg" width="640" height="452" alt="Graze Me, Craze Me">
  <div class="meta"><div class="n">05</div><h2>Graze Me, Craze Me</h2><p>$24 a person</p></div>
</section>
<section class="calc">
  <h1>Book a table</h1>
  <form>
    <label>Name<input id="n"></label>
    <label>Phone<input id="p" type="tel"></label>
    <label>Date<input id="d" type="date"></label>
    <label>Guests<input id="g" type="number" min="50" value="75"></label>
    <label>Table<select id="t"><option value="holy">01 Holy Grail</option><option value="grand">02 Grand</option><option value="super">03 Super</option><option value="standard">04 Standard</option><option value="graze">05 Graze Me</option></select></label>
    <label>Notes<textarea id="m" rows="3"></textarea></label>
    <div id="est"></div>
    <div class="go">
      <button type="button" id="smsBtn">Text</button>
      <button type="button" id="emailBtn">Email</button>
    </div>
    <p id="hint"></p>
  </form>
</section>
<script src="engine.js"></script>
<script src="quiet.js"></script>
</body>
</html>
