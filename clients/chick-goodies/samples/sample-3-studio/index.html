<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a table — Charcuterie Chick, Tomball</title>
<meta name="description" content="Price a grazing table in Tomball. Guests, date, table. Food plus $229 setup plus 18 percent tax. Text Tricia. 50-guest minimum.">
<link rel="canonical" href="https://charcuterie-chick-sample-3.vercel.app/">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fff; --ink:#111; --mute:#898989; --line:rgba(34,42,53,.1); --fill:#111; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; }
  a { color: inherit; }
  .app {
    display: grid;
    grid-template-columns: minmax(320px, 420px) 1fr;
    height: 100vh; height: 100dvh;
  }
  .pane {
    border-right: 1px solid var(--line);
    padding: 28px 28px 24px;
    overflow: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .brand strong { font-weight: 600; letter-spacing: -.02em; }
  .brand span { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size: 11px; color: var(--mute); }
  h1 { font-size: 28px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; margin: 0; }
  .sub { color: var(--mute); font-size: 14px; line-height: 1.45; margin: 0; }
  .field { display: grid; gap: 6px; }
  .field span { font-size: 12px; color: var(--mute); font-family:"IBM Plex Mono", ui-monospace, monospace; }
  input, select, textarea {
    width: 100%; border: 0; box-shadow: 0 0 0 1px var(--line);
    border-radius: 8px; padding: 10px 12px; background: #fff; outline: none;
  }
  input:focus, select:focus, textarea:focus { box-shadow: 0 0 0 2px #111; }
  .step { display: flex; align-items: center; gap: 8px; }
  .step button {
    width: 36px; height: 36px; border-radius: 8px; border: 0; box-shadow: 0 0 0 1px var(--line);
    background: #fff; cursor: pointer;
  }
  .step input { text-align: center; }
  .tables { display: grid; gap: 6px; }
  .tables label {
    display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center;
    padding: 10px 12px; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); cursor: pointer;
  }
  .tables label.on { box-shadow: 0 0 0 2px #111; }
  .tables em { font-style: normal; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size: 12px; color: var(--mute); }
  .total {
    margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line);
    display: grid; gap: 6px;
  }
  .total .big { font-size: 32px; font-weight: 600; letter-spacing: -.04em; }
  .total small { color: var(--mute); font-size: 12px; line-height: 1.4; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    appearance: none; border: 0; background: var(--fill); color: #fff;
    padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: 500;
  }
  .btn.ghost { background: #fff; color: #111; box-shadow: 0 0 0 1px var(--line); }
  .stage { position: relative; background: #f5f5f5; overflow: hidden; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage .cap {
    position: absolute; left: 24px; bottom: 24px; right: 24px;
    background: #fff; padding: 16px 18px; border-radius: 12px;
    box-shadow: rgba(19,19,22,.12) 0 8px 24px;
  }
  .stage .cap h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.02em; }
  .stage .cap p { margin: 0; color: var(--mute); font-size: 13px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; }
    .pane { border-right: 0; border-top: 1px solid var(--line); order: 2; }
    .stage { order: 1; min-height: 52vh; }
    .stage img { object-fit: contain; background: #111; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="pane">
    <div class="brand">
      <strong>Charcuterie Chick</strong>
      <span>Tomball, TX</span>
    </div>
    <h1>Price a table.</h1>
    <p class="sub">Food + $229 setup + 18% tax. 50-guest minimum on per-person tables. Tricia still confirms the date.</p>

    <label class="field"><span>Your name</span><input id="n" autocomplete="name"></label>
    <label class="field"><span>Phone</span><input id="p" type="tel" autocomplete="tel"></label>
    <label class="field"><span>Event date</span><input id="d" type="date"></label>
    <div class="field">
      <span>Guests</span>
      <div class="step">
        <button type="button" id="minus" aria-label="Fewer">−</button>
        <input id="g" inputmode="numeric" value="75">
        <button type="button" id="plus" aria-label="More">+</button>
      </div>
    </div>

    <div class="field">
      <span>Table</span>
      <div class="tables" id="tables"></div>
    </div>

    <label class="field"><span>Notes</span><textarea id="m" rows="2" placeholder="Dietary, venue, timing"></textarea></label>

    <div class="total">
      <div class="big" id="big">—</div>
      <small id="note">Pick a table.</small>
      <div class="actions">
        <button type="button" class="btn" id="smsBtn">Text this quote</button>
        <button type="button" class="btn ghost" id="emailBtn">Email</button>
        <button type="button" class="btn ghost" id="copyBtn">Copy</button>
      </div>
      <small id="hint">832-458-8180 · charcuteriechick@outlook.com · nothing is sent until you tap send</small>
    </div>
  </aside>
  <main class="stage">
    <img id="photo" src="img/knot-hero.jpg" width="945" height="720" alt="Holy Grail of Grazing">
    <div class="cap">
      <h2 id="capName">Holy Grail of Grazing</h2>
      <p id="capInc"></p>
    </div>
  </main>
</div>
<script src="engine.js"></script>
<script>
(function(){
  var ids = ["holy","grand","super","standard","graze"];
  var wrap = document.getElementById("tables");
  ids.forEach(function(id, i){
    var t = CHICK.byId(id);
    var lab = document.createElement("label");
    lab.innerHTML = '<input type="radio" name="table" value="'+t.id+'"'+(i===0?' checked':'')+'> <span>'+t.name+'</span> <em>'+t.priceLabel+'</em>';
    wrap.appendChild(lab);
  });
  function currentId(){
    var r = document.querySelector('input[name="table"]:checked');
    return r ? r.value : "holy";
  }
  function state(){
    return {
      name: document.getElementById("n").value.trim(),
      phone: document.getElementById("p").value.trim(),
      date: document.getElementById("d").value,
      guests: document.getElementById("g").value.trim(),
      table: CHICK.byId(currentId()),
      details: document.getElementById("m").value.trim()
    };
  }
  function render(){
    var s = state();
    document.querySelectorAll(".tables label").forEach(function(l){
      l.classList.toggle("on", l.querySelector("input").checked);
    });
    var t = s.table;
    var img = document.getElementById("photo");
    img.src = t.img; img.alt = t.name; img.width = t.w; img.height = t.h;
    document.getElementById("capName").textContent = t.name;
    document.getElementById("capInc").textContent = t.include;
    var q = CHICK.compute(t.id, s.guests);
    var big = document.getElementById("big");
    var note = document.getElementById("note");
    if (q && q.ok) {
      big.textContent = CHICK.money(q.total);
      note.textContent = "Food "+CHICK.money(q.food)+" + setup "+CHICK.money(q.setup)+" + tax "+CHICK.money(q.tax)+". "+q.note+" Not a booking.";
    } else {
      big.textContent = t.priceLabel;
      note.textContent = q ? q.note : "";
    }
  }
  wrap.addEventListener("change", render);
  document.getElementById("g").addEventListener("input", render);
  document.getElementById("minus").onclick = function(){
    var n = parseInt(document.getElementById("g").value,10)||0;
    document.getElementById("g").value = Math.max(1, n-5); render();
  };
  document.getElementById("plus").onclick = function(){
    var n = parseInt(document.getElementById("g").value,10)||0;
    document.getElementById("g").value = n+5; render();
  };
  document.getElementById("smsBtn").onclick = function(){ CHICK.sms(state()); };
  document.getElementById("emailBtn").onclick = function(){ CHICK.email(state()); };
  document.getElementById("copyBtn").onclick = function(){ CHICK.copy(state(), document.getElementById("hint")); };
  render();
})();
</script>
</body>
</html>
