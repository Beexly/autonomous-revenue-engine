<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walk the Menu — Charcuterie Chick</title>
<meta name="description" content="A horizontal walk through Tricia’s published tables in Tomball. Open a panel, price food plus setup plus tax, text the quote.">
<link rel="canonical" href="https://charcuterie-chick-sample-3.vercel.app/">
<meta name="theme-color" content="#11110F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --void:#11110F; --paper:#EDE7DB; --ink:#11110F; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--void); color:var(--paper); font-family:Syne, system-ui, sans-serif; }
  button, input, textarea { font:inherit; color:inherit; background:none; border:0; }
  a { color:inherit; text-decoration:none; }
  ::selection { background:var(--paper); color:var(--void); }
  .cur {
    width:14px; height:14px; border:1px solid #EDE7DB; border-radius:50%;
    position:fixed; top:0; left:0; margin:-7px 0 0 -7px; pointer-events:none; z-index:200;
    mix-blend-mode:difference;
  }
  .cur.down { width:28px; height:28px; margin:-14px 0 0 -14px; }
  html.has-cur, html.has-cur * { cursor:none !important; }
  #gate {
    position:fixed; inset:0; z-index:80; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px; background:var(--void); text-align:center;
  }
  #gate.off { opacity:0; pointer-events:none; transition:opacity .7s ease; }
  #gate .word { font-size:clamp(1.4rem, 4.5vw, 2.6rem); letter-spacing:.4em; text-transform:uppercase; font-weight:500; }
  #gate .sub { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.3em; text-transform:uppercase; opacity:.45; }
  .hold { width:88px; height:88px; border-radius:50%; display:grid; place-items:center; position:relative; }
  .hold svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .hold circle { fill:none; stroke:rgba(237,231,219,.2); stroke-width:1; }
  .hold [data-ring] { stroke:var(--paper); stroke-dasharray:88; stroke-dashoffset:88; }
  .hold span { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:9px; letter-spacing:.2em; text-transform:uppercase; }
  .hud {
    position:fixed; top:0; left:0; right:0; z-index:5;
    display:flex; justify-content:space-between; align-items:baseline;
    padding:20px 4vw; font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:10px; letter-spacing:.22em; text-transform:uppercase; mix-blend-mode:difference;
  }
  .strip {
    display:flex; height:100vh; height:100dvh; overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory; scrollbar-width:none;
  }
  .strip::-webkit-scrollbar { display:none; }
  .panel {
    flex: 0 0 100vw; height:100%; scroll-snap-align:start; scroll-snap-stop:always;
    display:grid; grid-template-columns: 42vw 58vw; align-items:stretch;
  }
  .panel .txt {
    padding: 18vh 6vw 10vh; display:flex; flex-direction:column; justify-content:flex-end; gap:14px;
  }
  .panel .k { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.28em; text-transform:uppercase; opacity:.45; }
  .panel h2 {
    margin:0; font-weight:500; font-size:clamp(2.2rem, 5.5vw, 5rem);
    letter-spacing:-.04em; line-height:.92; max-width:9ch;
  }
  .panel .pr { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:12px; letter-spacing:.12em; opacity:.7; }
  .panel .inc { max-width:28rem; line-height:1.5; opacity:.62; font-size:14px; }
  .open {
    align-self:flex-start; font-family:"IBM Plex Mono", ui-monospace, monospace;
    font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    border-bottom:1px solid var(--paper); padding:8px 0;
  }
  .panel .media {
    display:grid; place-items:center; background:#0A0908; padding:8vh 5vw;
  }
  .panel .media img { max-width:100%; max-height:76vh; width:auto; height:auto; }
  .bar {
    position:fixed; left:4vw; right:4vw; bottom:22px; height:1px; background:rgba(237,231,219,.18); z-index:5;
  }
  .bar i { display:block; height:1px; background:var(--paper); width:20%; }
  #sheet {
    position:fixed; inset:auto 0 0 0; z-index:30; background:var(--paper); color:var(--ink);
    transform:translateY(110%); transition:transform .45s cubic-bezier(.22,1,.36,1);
    padding:28px 6vw 36px; display:grid; grid-template-columns: 1fr 1fr; gap:24px;
    max-height: 78vh; overflow:auto;
  }
  #sheet.on { transform:translateY(0); }
  #sheet h3 { margin:0; font-size:clamp(1.8rem, 3vw, 2.8rem); letter-spacing:-.03em; }
  #sheet .big { font-size:clamp(2rem, 4vw, 3.2rem); letter-spacing:-.04em; }
  #sheet form { display:grid; gap:10px; }
  #sheet label { display:grid; gap:4px; font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; opacity:.5; }
  #sheet input, #sheet textarea { border-bottom:1px solid rgba(17,17,15,.25); padding:8px 0; font-family:Syne, sans-serif; font-size:16px; color:var(--ink); opacity:1; }
  .txtb { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; padding:10px 0; border-bottom:1px solid var(--ink); margin-right:12px; color:var(--ink); }
  .x { font-family:"IBM Plex Mono", ui-monospace, monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; opacity:.5; }
  @media (max-width: 860px) {
    .panel { grid-template-columns:1fr; }
    .panel .media { min-height:42vh; padding:6vh 8vw 0; }
    .panel .txt { padding: 4vh 8vw 12vh; }
    #sheet { grid-template-columns:1fr; }
  }
  @media (hover:none) { .cur { display:none !important; } html.has-cur, html.has-cur * { cursor:auto !important; } }
</style>
</head>
<body>
<div id="gate">
  <h1 class="word" id="gateWord">Walk the Menu</h1>
  <button type="button" class="hold" id="enter" aria-label="Click and hold to enter">
    <svg viewBox="0 0 32 32" width="88" height="88"><circle cx="16" cy="16" r="14"/><circle data-ring cx="16" cy="16" r="14"></circle></svg>
    <span>Hold</span>
  </button>
  <p class="sub">Click &amp; hold · scroll sideways</p>
</div>

<div class="hud">
  <span>Charcuterie Chick</span>
  <span id="pos">01 / 05</span>
  <span>Tomball, TX</span>
</div>
<div class="bar"><i id="fill"></i></div>
<div class="strip" id="strip"></div>

<div id="sheet">
  <div>
    <button type="button" class="x" id="close">Close ↙</button>
    <p class="k" id="sk" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;opacity:.45;margin:12px 0 8px"></p>
    <h3 id="sname"></h3>
    <p id="sinc" style="opacity:.65;line-height:1.5"></p>
    <p class="big" id="big">—</p>
    <p id="note" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;opacity:.55"></p>
  </div>
  <form>
    <label>Guests<input id="g" value="75" inputmode="numeric"></label>
    <label>Date<input id="d" type="date"></label>
    <label>Name<input id="n" autocomplete="name"></label>
    <label>Phone<input id="p" type="tel"></label>
    <label>Notes<textarea id="m" rows="2"></textarea></label>
    <div>
      <button type="button" class="txtb" id="smsBtn">Text this quote</button>
      <button type="button" class="txtb" id="emailBtn">Email</button>
      <button type="button" class="txtb" id="copyBtn">Copy</button>
    </div>
    <p id="hint" style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.4">Nothing is sent until you tap send.</p>
  </form>
</div>

<script src="engine.js"></script>
<script src="craft.js"></script>
<script>
(function(){
  CRAFT.space(document.getElementById("gateWord"));
  CRAFT.cursor();
  var ids=["holy","grand","super","standard","graze"];
  var strip=document.getElementById("strip");
  var openId="holy";
  ids.forEach(function(id,i){
    var t=CHICK.byId(id);
    var p=document.createElement("article");
    p.className="panel";
    p.dataset.id=id;
    p.innerHTML =
      '<div class="txt">'+
        '<p class="k">[ US_0'+(i+1)+' ]  [ table ]</p>'+
        '<h2>'+t.name+'</h2>'+
        '<p class="pr">'+t.priceLabel+(t.unit?'  ·  '+t.unit:'')+'</p>'+
        '<p class="inc">'+t.include+'</p>'+
        '<button type="button" class="open" data-open="'+t.id+'">Open  [+]</button>'+
      '</div>'+
      '<div class="media"><img src="'+t.img+'" width="'+t.w+'" height="'+t.h+'" alt="'+t.name+'"></div>';
    strip.appendChild(p);
  });
  function enter(){
    document.getElementById("gate").classList.add("off");
    setTimeout(function(){ document.getElementById("gate").style.display="none"; }, 700);
  }
  CRAFT.hold(document.getElementById("enter"), enter);
  strip.addEventListener("wheel", function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      strip.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, { passive:false });
  function tick(){
    var max = strip.scrollWidth - strip.clientWidth;
    var p = max ? strip.scrollLeft / max : 0;
    document.getElementById("fill").style.width = (20 + p*80) + "%";
    var i = Math.round(p * (ids.length-1));
    document.getElementById("pos").textContent = String(i+1).padStart(2,"0")+" / 0"+ids.length;
  }
  strip.addEventListener("scroll", tick, { passive:true });
  function render(){
    var t=CHICK.byId(openId);
    var q=CHICK.compute(openId, g.value);
    document.getElementById("sk").textContent="[ quote ]  [ "+t.n+" ]";
    document.getElementById("sname").textContent=t.name;
    document.getElementById("sinc").textContent=t.include;
    document.getElementById("big").textContent=(q&&q.ok)?CHICK.money(q.total):t.priceLabel;
    document.getElementById("note").textContent=(q&&q.ok)?("Food "+CHICK.money(q.food)+" + setup "+CHICK.money(q.setup)+" + tax "+CHICK.money(q.tax)+". "+q.note): (q?q.note:"");
  }
  function state(){
    return { name:n.value.trim(), phone:p.value.trim(), date:d.value, guests:g.value.trim(), table:CHICK.byId(openId), details:m.value.trim() };
  }
  strip.addEventListener("click", function(e){
    var b=e.target.closest("[data-open]"); if(!b) return;
    openId=b.getAttribute("data-open");
    render();
    document.getElementById("sheet").classList.add("on");
  });
  document.getElementById("close").onclick=function(){ document.getElementById("sheet").classList.remove("on"); };
  g.addEventListener("input", render);
  smsBtn.onclick=function(){ CHICK.sms(state()); };
  emailBtn.onclick=function(){ CHICK.email(state()); };
  copyBtn.onclick=function(){ CHICK.copy(state(), hint); };
  tick();
})();
</script>
</body>
</html>
